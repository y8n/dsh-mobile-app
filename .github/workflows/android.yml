name: Android
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check public source defaults and documentation
        run: node scripts/opensource/check.mjs
      - name: Verify Desktop extension recovery
        run: |
          node --check desktop/mobile-extension/index.mjs
          node --test desktop/mobile-extension/tests/*.test.mjs scripts/releases/tests/*.test.mjs
      - run: ./gradlew :app:assembleDebug :app:lintDebug :app:testDebugUnitTest :core:protocol:test
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-mobile-debug
          path: app/build/outputs/apk/debug/app-debug.apk
