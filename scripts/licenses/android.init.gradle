// Resolve module artifacts only; this task does not compile or package an APK.
gradle.projectsEvaluated {
    def app = gradle.rootProject.project(':app')
    app.tasks.register('collectLicenseCoordinates') {
        doLast {
            def modules = [:]
            ['debugRuntimeClasspath', 'releaseRuntimeClasspath'].each { name ->
                def config = app.configurations.getByName(name)
                def artifacts = config.incoming.artifactView {
                    componentFilter { id -> id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier }
                }.artifacts.artifacts
                artifacts.each { artifact ->
                    def id = artifact.id.componentIdentifier
                    def key = "${id.group}:${id.module}:${id.version}"
                    def item = modules.computeIfAbsent(key) { [group:id.group, name:id.module, version:id.version, configurations:[], artifacts:[]] }
                    item.configurations.add(name)
                    item.artifacts.add(artifact.file.absolutePath)
                }
            }
            def rows = modules.values().sort { "${it.group}:${it.name}:${it.version}" }.collect { item ->
                item.configurations = item.configurations.unique().sort()
                item.artifacts = item.artifacts.unique().sort()
                item
            }
            def output = new File(gradle.rootProject.projectDir, 'build/reports/licenses/android-runtime.json')
            output.parentFile.mkdirs()
            output.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(rows))
            println "License inventory: ${rows.size()} resolved runtime modules"
        }
    }
}
